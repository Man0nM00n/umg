<div class="footer-container">
  <div class="footer-wrapper">
    <div class="footer-logo">
      <img class="flogo" src="logo.svg" alt="Footer Logo"  />
      <div class="mt-2 block info">
        <p>Ouagadougou <br> <br>Burkina Faso</p>
        <p>infoumg.bf</p>
        <p>+226 25 36 54 50</p>
      </div>
    </div>
    <div class="footer-content">
          <div class="links">
            <h3 class="text-xl font-semibold">Quick Links</h3>
            <ul class="mt-2" >
              <li *ngFor="let link of menus">
                <a href={{link.url}} class="nav-link ">{{link.label}}</a>
              </li>
            </ul>
        </div>
        <div class="news">
            <div class="news-card">
              <span class="title">Newsletter</span>
              <p class="content">
                Send us your email to receive our newsletter.
              </p>
              <form class="form">
                <input required="" type="email" placeholder="Your email here" />
                <button class="card-button">SEND</button>
              </form>
            </div>
            
        </div>        


      <div class="map">

      </div>
  
    </div>
  </div>
  <div class="footer-bottom">
    <span>brought to you by NEC SYSTEMS</span>
  </div>
</div>
